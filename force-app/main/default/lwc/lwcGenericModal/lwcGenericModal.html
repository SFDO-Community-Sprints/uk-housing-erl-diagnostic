<template>
    <lightning-modal-header label={header}></lightning-modal-header>
    <lightning-modal-body>
        <template lwc:if={isCaseComment}>
            <template lwc:if={hasContent}>
                <lightning-formatted-rich-text value={content} class="slds-align_absolute-center"></lightning-formatted-rich-text>    
            </template>
        </template>
        <template lwc:elseif={hasContent}>
            <lightning-formatted-rich-text value={content}></lightning-formatted-rich-text>    
        </template>
        <template lwc:if={hasCombobox}>
            <div class="slds-var-m-top_medium">
                <lightning-combobox
                    label={comboboxLabel}
                    placeholder={comboboxPlaceholder}
                    options={comboboxOptions}
                    value={selectedComboboxValue}
                    onchange={handleComboboxChange}
                    required={isComboboxRequired}
                ></lightning-combobox>
                <template lwc:if={isOtherSelected}>
                    <div class="slds-var-m-top_small">
                        <lightning-input
                            type="text"
                            label={otherDetailsLabel}
                            placeholder={otherDetailsPlaceholder}
                            value={otherDetailsValue}
                            onchange={handleOtherDetailsChange}
                            required="true"
                        ></lightning-input>
                    </div>
                </template>
            </div>
        </template>
        <template lwc:if={isFlow}>
            <lightning-flow
                onstatuschange={handleFlowStatusChange}
                flow-api-name={flowName}
                flow-input-variables={flowParams}
            ></lightning-flow>
        </template>
    </lightning-modal-body>
    <lightning-modal-footer>
        <div class="slds-grid slds-grid_reverse slds-gutters slds-var-p-top_small">
            <template lwc:if={displayCancelButton}>
                <div class="slds-col slds-grow-none">
                    <lightning-button
                        label={cancelButtonLabel}
                        variant={cancelButtonVariant}
                        onclick={handleCancel}
                    ></lightning-button>
                </div>
            </template>
            <template lwc:if={displayOkButton}>
                <div class="slds-col slds-grow-none">
                    <lightning-button
                        label={okButtonLabel}
                        variant={okButtonVariant}
                        onclick={handleOk}
                        disabled={isOkButtonDisabled}
                    ></lightning-button>
                </div>
            </template>
            <template lwc:if={onlyDisplayingCloseButton}>
                <div class="slds-col slds-grow-none">
                    <lightning-button
                        label="Close"
                        onclick={handleClose}
                    ></lightning-button>
                </div>
            </template>
        </div>
    </lightning-modal-footer>
</template>
