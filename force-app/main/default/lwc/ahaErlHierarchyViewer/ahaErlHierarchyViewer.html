<template>
    <lightning-card title="SOR Hierarchy Viewer" icon-name="standard:hierarchy">
        <div slot="actions">
            <lightning-button
                label="Download CSV"
                icon-name="utility:download"
                onclick={handleDownloadCsv}
                disabled={isLoading}
                class="slds-m-right_small"
                variant="neutral">
            </lightning-button>
            <lightning-button
                label="Copy to Clipboard"
                icon-name="utility:copy_to_clipboard"
                onclick={handleCopyToClipboard}
                disabled={isLoading}
                variant="brand">
            </lightning-button>
        </div>
        <div class="slds-m-around_medium">
            <!-- Profile Selector -->
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-combobox
                        name="profile"
                        label="Select Profile"
                        value={selectedProfile}
                        placeholder="Choose a profile"
                        options={profileOptions}
                        onchange={handleProfileChange}
                        required>
                    </lightning-combobox>
                </div>
            </div>

            <!-- Statistics -->
            <template if:true={showStats}>
                <div class="slds-grid slds-gutters slds-m-bottom_medium">
                    <div class="slds-col">
                        <lightning-layout multiple-rows>
                            <lightning-layout-item size="4" padding="around-small">
                                <div class="slds-box slds-theme_shade slds-text-align_center">
                                    <div class="slds-text-heading_large">{totalRecords}</div>
                                    <div class="slds-text-body_small">Total SORs</div>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="4" padding="around-small">
                                <div class="slds-box slds-theme_shade slds-text-align_center">
                                    <div class="slds-text-heading_large">{recordCount}</div>
                                    <div class="slds-text-body_small">Filtered Results</div>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="4" padding="around-small">
                                <div class="slds-box slds-theme_shade slds-text-align_center">
                                    <div class="slds-text-heading_large slds-text-color_error">{inaccessibleCount}</div>
                                    <div class="slds-text-body_small">Inaccessible SORs</div>
                                </div>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
                </div>
            </template>

            <!-- Filters -->
            <template if:true={selectedProfile}>
                <div class="slds-grid slds-gutters slds-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input
                            type="search"
                            label="Search"
                            placeholder="Search by SOR code, description, or category path..."
                            value={searchTerm}
                            onchange={handleSearchChange}>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-4">
                        <lightning-input
                            type="checkbox"
                            label="Show only accessible SORs"
                            checked={showOnlyAccessible}
                            onchange={handleAccessibilityFilterChange}>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-4">
                        <lightning-input
                            type="checkbox"
                            label="Include closeup categories"
                            checked={includeCloseups}
                            onchange={handleCloseupFilterChange}>
                        </lightning-input>
                    </div>
                </div>
            </template>

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <div class="slds-text-align_center slds-m-vertical_large">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                </div>
            </template>

            <!-- Error Message -->
            <template if:true={error}>
                <div class="slds-m-top_medium">
                    <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                        <span class="slds-assistive-text">error</span>
                        <h2>Error loading data: {error.body.message}</h2>
                    </div>
                </div>
            </template>

            <!-- Data Table -->
            <template if:true={hasData}>
                <lightning-datatable
                    key-field="uniqueKey"
                    data={filteredData}
                    columns={columns}
                    hide-checkbox-column
                    sorted-by={sortedBy}
                    sorted-direction={sortedDirection}
                    onsort={handleSort}
                    class="slds-max-medium-table_stacked">
                </lightning-datatable>
            </template>

            <!-- No Data Message -->
            <template if:false={hasData}>
                <template if:false={isLoading}>
                    <template if:true={selectedProfile}>
                        <div class="slds-text-align_center slds-m-vertical_large">
                            <lightning-icon icon-name="utility:info" size="large" alternative-text="No data"></lightning-icon>
                            <p class="slds-m-top_small">
                                <template if:true={searchTerm}>
                                    No SORs found matching your search criteria.
                                </template>
                                <template if:false={searchTerm}>
                                    No SORs found for the selected profile.
                                </template>
                            </p>
                        </div>
                    </template>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
